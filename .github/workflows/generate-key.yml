name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore and output Base64
        run: |
          keytool -genkey -v -keystore release.keystore -alias studykey -keyalg RSA -keysize 2048 -validity 10000 -storepass studyapp123 -keypass studyapp123 -dname "CN=StudyApp, OU=Dev, O=BSUIR, C=BY"
          echo "### Скопируйте этот текст в секрет KEYSTORE_BASE64:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          base64 release.keystore -w 0 >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Keystore file
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-file
          path: release.keystore